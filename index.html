<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LJSportMind</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <img src="logo.svg" alt="LJSportMind logo" class="logo">
      <h1>LJSport<span>Mind</span></h1>
      <p class="tagline">Discover Your Path. Create Your Impact.</p>
      <p id="passportBanner" class="passport-banner" hidden></p>
    </header>

    <nav class="tabs">
      <button type="button" class="tab active" data-tab="passport">Sports Passport</button>
      <button type="button" class="tab" data-tab="creator">Creator Studio</button>
    </nav>

    <section id="passportPanel" class="tab-panel active">
      <form id="passportForm">
        <div class="row">
          <div class="field">
            <label for="pName">Name</label>
            <input type="text" id="pName" placeholder="e.g. Luis Juarez">
          </div>
          <div class="field">
            <label for="pLocation">Location</label>
            <input type="text" id="pLocation" placeholder="e.g. Los Angeles, CA">
          </div>
        </div>

        <div class="field">
          <label for="pRole">Current role / experience</label>
          <select id="pRole">
            <option>Player</option>
            <option>Former Player</option>
            <option>Coach</option>
            <option>Student</option>
            <option>Content Creator</option>
            <option>Fan / Enthusiast</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label>Skills (select all that apply)</label>
          <div class="checkbox-grid" id="pSkills">
            <label class="checkbox-pill"><input type="checkbox" value="video editing"> Video Editing</label>
            <label class="checkbox-pill"><input type="checkbox" value="writing"> Writing</label>
            <label class="checkbox-pill"><input type="checkbox" value="coaching"> Coaching</label>
            <label class="checkbox-pill"><input type="checkbox" value="data & analytics"> Data & Analytics</label>
            <label class="checkbox-pill"><input type="checkbox" value="social media"> Social Media</label>
            <label class="checkbox-pill"><input type="checkbox" value="playing experience"> Playing Experience</label>
            <label class="checkbox-pill"><input type="checkbox" value="event management"> Event Management</label>
            <label class="checkbox-pill"><input type="checkbox" value="marketing & sales"> Marketing & Sales</label>
            <label class="checkbox-pill"><input type="checkbox" value="photography / design"> Photography / Design</label>
            <label class="checkbox-pill"><input type="checkbox" value="broadcasting / on-camera"> Broadcasting / On-Camera</label>
          </div>
        </div>

        <div class="field">
          <label>Interests (select all that apply)</label>
          <div class="checkbox-grid" id="pInterests">
            <label class="checkbox-pill"><input type="checkbox" value="content creation"> Content Creation</label>
            <label class="checkbox-pill"><input type="checkbox" value="coaching & player development"> Coaching & Player Development</label>
            <label class="checkbox-pill"><input type="checkbox" value="scouting & analytics"> Scouting & Analytics</label>
            <label class="checkbox-pill"><input type="checkbox" value="journalism & broadcasting"> Journalism & Broadcasting</label>
            <label class="checkbox-pill"><input type="checkbox" value="marketing & sponsorship"> Marketing & Sponsorship</label>
            <label class="checkbox-pill"><input type="checkbox" value="event operations"> Event Operations</label>
            <label class="checkbox-pill"><input type="checkbox" value="front office / team ops"> Front Office / Team Ops</label>
            <label class="checkbox-pill"><input type="checkbox" value="personal brand building"> Personal Brand Building</label>
          </div>
        </div>

        <div class="field">
          <label for="pGoal">Career goal</label>
          <select id="pGoal">
            <option value="media">Break into sports media / content</option>
            <option value="coach">Become a coach</option>
            <option value="frontoffice">Work in a team front office</option>
            <option value="brand">Build my own personal brand</option>
            <option value="analytics">Become a scout / analyst</option>
            <option value="explore">Still exploring</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit">Find My Fit</button>
        </div>
      </form>

      <section id="passportResults" hidden>
        <div class="card">
          <h3>Your Sports Passport</h3>
          <p id="passportSummary"></p>
        </div>
        <div id="matchList"></div>
      </section>
    </section>

    <section id="creatorPanel" class="tab-panel">
    <form id="gameForm">
      <div class="row">
        <div class="field">
          <label for="teamA">Team A</label>
          <input type="text" id="teamA" placeholder="e.g. Arsenal" required>
        </div>
        <div class="field">
          <label for="teamB">Team B</label>
          <input type="text" id="teamB" placeholder="e.g. Chelsea" required>
        </div>
      </div>

      <div class="row">
        <div class="field small">
          <label for="scoreA">Score A</label>
          <input type="number" id="scoreA" min="0" required>
        </div>
        <div class="field small">
          <label for="scoreB">Score B</label>
          <input type="number" id="scoreB" min="0" required>
        </div>
        <div class="field">
          <label for="sport">Sport</label>
          <select id="sport">
            <option value="goal">Soccer</option>
            <option value="point">Basketball</option>
            <option value="point">Football</option>
            <option value="run">Baseball</option>
            <option value="point">Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="momentType">What kind of moment was it?</label>
        <select id="momentType">
          <option value="comeback">Comeback</option>
          <option value="blowout">Blowout</option>
          <option value="buzzer">Last-Minute / Buzzer-Beater Winner</option>
          <option value="upset">Upset</option>
          <option value="controversial">Controversial Call</option>
          <option value="milestone">Milestone / Record</option>
          <option value="close">Close, Back-and-Forth Game</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="keyMoment">Key moment</label>
        <textarea id="keyMoment" rows="2" placeholder="e.g. 89th-minute equalizer off a corner kick" required></textarea>
      </div>

      <div class="field">
        <label for="observation">Your take / observation (optional)</label>
        <textarea id="observation" rows="2" placeholder="e.g. Their defense fell apart after the red card"></textarea>
      </div>

      <div class="actions">
        <button type="submit">Generate Content Ideas</button>
        <button type="button" id="regenBtn" class="secondary" hidden>Regenerate</button>
      </div>
    </form>

    <section id="results" hidden>
      <div class="card">
        <h3>Content Hook</h3>
        <p id="outHook"></p>
      </div>
      <div class="card">
        <h3>Short-Form Video Idea</h3>
        <p id="outVideo"></p>
      </div>
      <div class="card">
        <h3>Engagement Question</h3>
        <p id="outQuestion"></p>
      </div>
      <div class="card">
        <h3>Caption</h3>
        <p id="outCaption"></p>
      </div>
      <div class="card">
        <h3>Voiceover Script</h3>
        <ol id="outScript" class="script-list"></ol>
        <div class="actions">
          <button type="button" id="playBtn" class="secondary">▶ Play Voiceover</button>
          <button type="button" id="stopBtn" class="secondary" hidden>■ Stop</button>
          <button type="button" id="copyScriptBtn" class="secondary">Copy Script</button>
        </div>
        <p id="ttsWarning" class="warning" hidden>Your browser doesn't support built-in text-to-speech playback. You can still read/copy the script above.</p>
      </div>
    </section>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
