<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LJ LIVE Promo</title>
<meta name="description" content="A 19-second vertical ad for LJ LIVE, built from today's real scores. Save it as a video to post.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap">
<style>
  :root { --bg: #050608; --text: #f3f1ea; --muted: #9da1ab; --gold: #e9c77b; --border: rgba(233, 199, 123, 0.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; min-height: 100vh; }
  .stage { position: relative; height: min(78vh, calc((100vw - 32px) * 16 / 9)); aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border); }
  canvas { width: 100%; height: 100%; display: block; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  button, .link { font: 700 14px Inter, sans-serif; padding: 11px 18px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04); color: var(--text); cursor: pointer; text-decoration: none; }
  button.primary { background: linear-gradient(135deg, #f6e1a6, #e9c77b 40%, #c9974a); color: #14110a; border: 0; }
  button:disabled { opacity: 0.6; cursor: default; }
  .note { margin: 0; font-size: 12px; color: var(--muted); text-align: center; max-width: 520px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="stage"><canvas id="ad" width="1080" height="1920" role="img" aria-label="LJ LIVE promo built from today's real scores"></canvas></div>
  <div class="controls">
    <button type="button" id="replay">Replay</button>
    <button type="button" id="record" class="primary">Save as video</button>
    <a class="link" href="./">Open LJ LIVE</a>
  </div>
  <p class="note" id="note">Scores are today's real results from ESPN's public scoreboard. Add a sound on TikTok or Reels when you post.</p>
  <script src="clutch.js"></script>
  <script src="promo.js"></script>
</body>
</html>
